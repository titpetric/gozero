vars:
  packages: [.]

  # Inlining is disabled for the benchmarks. Without -l the native baselines
  # get inlined into the loop body and measure nothing, while the reflect path
  # crosses non-inlinable boundaries either way, so the multipliers come out of
  # a comparison that was never fair.
  benchflags: -run XXX -bench . -benchmem -benchtime 10s -count 3 -gcflags=all=-l

  # Every benchmark is pinned to one core at top priority. This machine runs
  # other work, and unpinned the same native call read anywhere from 509n to
  # 913n between sweeps. Pinned it repeats within 2%, which is what makes the
  # packages comparable to each other. Absolute numbers are higher than an
  # idle box would give, because the core is shared and the GC runs on it too.
  # Needs root for nice -n -20.
  pin: taskset -c 3 nice -n -20

  # A discarded run before the measured ones, to bring the CPU up to speed.
  # Whichever package goes first otherwise absorbs the ramp: internal/parse
  # read 1036n to 1887n as the first package of a sweep against 615n behind
  # three seconds of load. 200ms of warmup was not enough, 3s is.
  warmup: -run XXX -bench . -benchtime 3s -gcflags=all=-l

env:
  vars:
    CGO_ENABLED: "0"

jobs:
  default:
    desc: Format, test and benchmark
    steps:
      - task: fmt
      - task: lint
      - task: test
      - task: bench

  fmt:
    desc: Format the module
    passthru: true
    steps:
      - run: splint --fix ./...

  lint:
    desc: Vet
    steps:
      - run: go vet ./...

  test:
    desc: Run the tests
    steps:
      - run: go test -count 1 -cover ./...
      - name: race
        env:
          vars:
            CGO_ENABLED: "1"
        run: go test -count 1 -race ./...

  test:discovery:
    aliases: [discovery]
    desc: Print the types discovered from a set of standard library bindings
    # The test prints its tables and the slog output only under -v, so
    # the verbose flag is the point of this job rather than a detail.
    # passthru prints it under the tree; run with --final for the
    # untruncated form, since the output is what the job is for.
    passthru: true
    steps:
      - run: go test -count 1 -run '^TestDiscovery$' -v .

  bench:
    desc: Run every benchmark with inlining disabled
    # 3 benchmarks at -benchtime 10s and -count 3 is around 90s of
    # measurement plus compilation. The count is there so benchstat can
    # report variance.
    timeout: 600s
    passthru: true
    steps:
      - name: warmup
        run: ${{ pin }} go test ${{ warmup }} . > /dev/null
      - name: bench ${{ pkg }}
        for: pkg in packages
        run: ${{ pin }} go test ${{ benchflags }} ./${{ pkg }}/

  bench:save:
    aliases: [save]
    desc: Write bench.txt and summarise it with benchstat
    timeout: 600s
    steps:
      - run: rm -f bench.txt
      - name: warmup
        run: ${{ pin }} go test ${{ warmup }} . > /dev/null
      - name: bench ${{ pkg }}
        for: pkg in packages
        run: ${{ pin }} go test ${{ benchflags }} ./${{ pkg }}/ >> bench.txt
      - task: bench:report

  bench:report:
    aliases: [report]
    desc: Summarise bench.txt
    steps:
      - run: benchstat bench.txt

  bench:profile:
    aliases: [profile]
    desc: Profile the cached execution path over 10s
    timeout: 300s
    steps:
      - name: warmup
        run: ${{ pin }} go test ${{ warmup }} . > /dev/null
      - run: ${{ pin }} go test -run XXX -bench 'BenchmarkCostAmortizedCache$' -benchmem -benchtime 10s -gcflags=all=-l -cpuprofile cpu.out -memprofile mem.out .
